<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Gaming Portal</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #08090d;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Effect */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            animation: pulse 8s infinite alternate;
        }
        .orb-1 {
            width: 350px;
            height: 350px;
            background: #ff0055;
            top: -50px;
            left: -50px;
            opacity: 0.5;
        }
        .orb-2 {
            width: 400px;
            height: 400px;
            background: #7000ff;
            bottom: -80px;
            right: -80px;
            opacity: 0.6;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -30px); }
        }

        /* Main Container */
        .portal-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(18, 20, 29, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            border-color: rgba(255, 0, 85, 0.3);
            box-shadow: 0 20px 50px rgba(255, 0, 85, 0.15);
        }

        /* Header Logo Icon */
        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ff0055, #7000ff);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.4);
            transform: rotate(-5deg);
            transition: transform 0.3s ease;
        }
        .glass-card:hover .brand-icon {
            transform: rotate(0deg) scale(1.05);
        }

        h2 {
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: #a0a5b5;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Input Styling */
        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 18px;
            transition: color 0.3s;
        }

        .input-box input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-box input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .input-box input:focus + i {
            color: #ff0055;
        }

        /* Neon Button */
        .btn-action {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff0055, #7000ff);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 0, 85, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 0, 85, 0.5);
            background: linear-gradient(135deg, #ff1a66, #801a00);
        }

        .btn-action:active {
            transform: translateY(0);
        }

        #status-msg {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }

        /* Dashboard Profile View */
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #ff0055;
            object-fit: cover;
            background: #1a1c23;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
        }

        .status-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 18px;
            height: 18px;
            background: #10b981;
            border: 3px solid #12141d;
            border-radius: 50%;
        }

        .user-tag {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ef4444;
            box-shadow: none;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.2);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Light Background Glows -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="portal-container">
        
        <!-- FORM ĐĂNG NHẬP -->
        <div class="glass-card" id="login-card">
            <div class="brand-icon">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <h2>ROBLOX CONNECT</h2>
            <p class="subtitle">Nhập Username để liên kết tài khoản</p>

            <div class="input-box">
                <input type="text" id="roblox-username" placeholder="Tên tài khoản Roblox..." autocomplete="off">
                <i class="fa-solid fa-user"></i>
            </div>

            <button class="btn-action" onclick="login()">
                <span>KẾT NỐI NGAY</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div id="status-msg"></div>
        </div>

        <!-- MAN HINH TRANG THAI KHIN DA DANG NHAP -->
        <div class="glass-card hidden" id="dashboard-card">
            <div class="avatar-container">
                <img id="user-avatar" class="avatar-img" src="" alt="Roblox Avatar">
                <div class="status-badge"></div>
            </div>
            
            <h2 id="welcome-username">Username</h2>
            <div class="user-tag"><i class="fa-solid fa-circle-check"></i> Đã xác minh Roblox</div>

            <button class="btn-action btn-logout" onclick="logout()">
                <i class="fa-solid fa-power-off"></i>
                <span>ĐĂNG XUẤT</span>
            </button>
        </div>

    </div>

    <script>
        // Kiểm tra phiên đăng nhập cũ
        window.onload = function() {
            const savedUser = localStorage.getItem("robloxUser");
            if (savedUser) {
                renderDashboard(savedUser);
            }
        };

        async function login() {
            const usernameInput = document.getElementById('roblox-username').value.trim();
            const msg = document.getElementById('status-msg');

            if (!usernameInput) {
                msg.style.color = "#ef4444";
                msg.innerHTML = "<i class='fa-solid fa-circle-exclamation'></i> Vui lòng nhập Username!";
                return;
            }

            msg.style.color = "#60a5fa";
            msg.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Đang kết nối Roblox...";

            // Lưu tên vào máy người dùng
            localStorage.setItem("robloxUser", usernameInput);

            setTimeout(() => {
                renderDashboard(usernameInput);
            }, 1000);
        }

        function renderDashboard(username) {
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('dashboard-card').classList.remove('hidden');
            document.getElementById('welcome-username').innerText = username;

            // Tải ảnh đại diện Roblox của người dùng thông qua API public
            const avatarImg = document.getElementById('user-avatar');
            avatarImg.src = `https://unavatar.io/roblox/${username}`;
            
            // Trường hợp không tìm thấy avatar thì dùng ảnh mặc định gaming
            avatarImg.onerror = function() {
                avatarImg.src = 'https://tr.rbxcdn.com/30day-avatar-headshot';
            };
        }

        function logout() {
            localStorage.removeItem("robloxUser");
            document.getElementById('roblox-username').value = "";
            document.getElementById('status-msg').innerText = "";
            
            document.getElementById('dashboard-card').classList.add('hidden');
            document.getElementById('login-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
