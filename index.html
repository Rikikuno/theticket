<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTDS THE TICKET</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        /* Nền Gradient động tông Dark Blue */
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #03045e, #023e8a, #0077b6, #001233);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Hiệu ứng Đèn Neon xanh mờ */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            animation: pulse 8s infinite alternate;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: #00b4d8;
            top: -100px;
            left: -100px;
            opacity: 0.35;
        }
        .orb-2 {
            width: 450px;
            height: 450px;
            background: #03045e;
            bottom: -120px;
            right: -120px;
            opacity: 0.6;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -30px); }
        }

        /* Khung chứa chính */
        .portal-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        /* Phong cách Glassmorphism */
        .glass-card {
            background: rgba(10, 17, 40, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            border-color: rgba(0, 180, 216, 0.4);
            box-shadow: 0 20px 50px rgba(0, 119, 182, 0.3);
        }

        /* Logo Icon Dark Blue */
        .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #0077b6, #03045e);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: rotate(-5deg);
            transition: transform 0.3s ease;
        }
        .glass-card:hover .brand-icon {
            transform: rotate(0deg) scale(1.05);
        }

        h2 {
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Ô nhập liệu */
        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 18px;
            transition: color 0.3s;
        }

        .input-box input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-box input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00b4d8;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.35);
        }

        .input-box input:focus + i {
            color: #00b4d8;
        }

        /* Nút bấm Dark Blue Neon */
        .btn-action {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0077b6, #023e8a);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 119, 182, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #0096c7, #0077b6);
            box-shadow: 0 15px 30px rgba(0, 180, 216, 0.45);
        }

        #status-msg {
            margin-top: 18px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
        }

        .user-tag {
            display: inline-block;
            background: rgba(0, 180, 216, 0.15);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 180, 216, 0.3);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ef4444;
            box-shadow: none;
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.2);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="portal-container">
        
        <!-- FORM ĐĂNG NHẬP -->
        <div class="glass-card" id="login-card">
            <div class="brand-icon">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <h2>ROBLOX CONNECT</h2>
            <p class="subtitle">Nhập Username để kết nối tài khoản</p>

            <div class="input-box">
                <input type="text" id="roblox-username" placeholder="Nhập tên Roblox của bạn..." autocomplete="off">
                <i class="fa-solid fa-user"></i>
            </div>

            <button class="btn-action" onclick="login()">
                <span>KẾT NỐI NGAY</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div id="status-msg"></div>
        </div>

        <!-- MÀN HÌNH HIỂN THỊ THÔNG TIN ĐÃ XÁC NHẬN -->
        <div class="glass-card hidden" id="dashboard-card">
            <div class="brand-icon">
                <i class="fa-solid fa-user-check"></i>
            </div>
            
            <h2 id="welcome-username">Username</h2>
            <p id="display-name" style="color: #94a3b8; font-size: 14px; margin-top: -5px; margin-bottom: 15px;"></p>
            
            <div class="user-tag"><i class="fa-solid fa-circle-check"></i> Đã kết nối Roblox thành công</div>

            <button class="btn-action btn-logout" onclick="logout()">
                <i class="fa-solid fa-power-off"></i>
                <span>ĐĂNG XUẤT</span>
            </button>
        </div>

    </div>

    <script>
        // Kiểm tra phiên làm việc cũ khi tải trang
        window.onload = function() {
            const savedUser = localStorage.getItem("robloxUser");
            if (savedUser) {
                renderDashboard(savedUser);
            }
        };

        function login() {
            const usernameInput = document.getElementById('roblox-username').value.trim();
            const msg = document.getElementById('status-msg');

            if (!usernameInput) {
                msg.style.color = "#ef4444";
                msg.innerHTML = "<i class='fa-solid fa-circle-exclamation'></i> Vui lòng nhập Username!";
                return;
            }

            msg.style.color = "#38bdf8";
            msg.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Đang xử lý...";

            setTimeout(() => {
                localStorage.setItem("robloxUser", usernameInput);
                renderDashboard(usernameInput);
            }, 400);
        }

        function renderDashboard(username) {
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('dashboard-card').classList.remove('hidden');
            
            document.getElementById('welcome-username').innerText = username;
            document.getElementById('display-name').innerText = `@${username}`;
        }

        function logout() {
            localStorage.removeItem("robloxUser");
            
            document.getElementById('roblox-username').value = "";
            document.getElementById('status-msg').innerText = "";
            
            document.getElementById('dashboard-card').classList.add('hidden');
            document.getElementById('login-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
